name: Build xxx1 Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          brew install make ldid xz
          echo "/opt/homebrew/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: '~/theos'          # أو theos
          theos-sdks: 'https://github.com/theos/sdks'  # SDKs الرسمية
          # theos-sdks-branch: 'master'   # اختياري

      - name: Build Tweak
        run: |
          make clean
          make package

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: xxx1-tweak
          path: packages/*.deb
          retention-days: 7

      - name: Show Build Result
        run: ls -la packages/
